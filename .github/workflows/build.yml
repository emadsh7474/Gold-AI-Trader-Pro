name: Build Gold AI Trader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Project
        run: |
          flutter create --platforms=android --project-name gold_ai_trader_pro app
          cp lib/main.dart app/lib/main.dart

      - name: Build APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-AI-Trader-Pro-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
